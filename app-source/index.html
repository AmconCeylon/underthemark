<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under the Mark — planned and actual, side by side</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22Under%20the%20Mark%22%3E%20%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236B5BF0%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%234A38D6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22url%28%23g%29%22%2F%3E%20%3Crect%20x%3D%2212%22%20y%3D%2223%22%20width%3D%2240%22%20height%3D%223.4%22%20rx%3D%221.7%22%20fill%3D%22%23fff%22%2F%3E%20%3Crect%20x%3D%2224.5%22%20y%3D%2234%22%20width%3D%2215%22%20height%3D%2218%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20opacity%3D%22.95%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22Under%20the%20Mark%22%3E%20%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236B5BF0%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%234A38D6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22url%28%23g%29%22%2F%3E%20%3Crect%20x%3D%2212%22%20y%3D%2223%22%20width%3D%2240%22%20height%3D%223.4%22%20rx%3D%221.7%22%20fill%3D%22%23fff%22%2F%3E%20%3Crect%20x%3D%2224.5%22%20y%3D%2234%22%20width%3D%2215%22%20height%3D%2218%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20opacity%3D%22.95%22%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="Under the Mark is a free budget planner and expense tracker. Set a planned amount and record the actual for every line, import a bank CSV, and see the difference in one place. Includes cheaper alternatives for services you already pay for. Built by Amcon Ceylon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --card-2:#FAFAFD;
  --deep:#171A2B; --deep-2:#0E111C; --deep-3:#262C47;
  --accent:#5646E4; --accent-2:#7A6CF0; --accent-soft:#EDEBFD; --accent-line:#CFC9FA;
  --ink:#171A2B; --muted:#606780; --faint:#8B92AC;
  --rule:#E4E6EF; --rule-2:#EFF0F6;
  --good:#0F8F5F; --good-soft:#E3F4EC; --good-line:#B9E2CE;
  --bad:#D63A2B; --bad-soft:#FCE8E5; --bad-line:#F3C7C1;
  --warn:#B07E09; --warn-soft:#FBF1DA; --warn-line:#EBD7A3;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --sh:0 1px 2px rgba(23,26,43,.04), 0 12px 32px -24px rgba(23,26,43,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:linear-gradient(178deg,var(--deep) 0%,var(--deep-2) 100%);color:#B9BFD6;
  padding:22px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;color:#fff;
  padding:0 22px 20px;display:flex;align-items:center;gap:10px;text-decoration:none}
.logo:hover{color:#fff;opacity:.88}
.logo .m{width:26px;height:26px;display:grid;place-items:center;flex:none}
.logo .m svg{display:block;border-radius:7px}
.navgrp{padding:14px 22px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#5D6584}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:#B9BFD6;padding:9px 22px;
  font-size:14.5px;border-left:3px solid transparent;transition:background .12s}
.nav:hover{background:rgba(255,255,255,.05);color:#fff}
.nav.on{background:rgba(86,70,228,.22);border-left-color:var(--accent-2);color:#fff;font-weight:600}
.nav .badge{float:right;font-family:var(--mono);font-size:11px;color:#7D85A3}
.side-foot{margin-top:auto;padding:18px 22px 0;border-top:1px solid rgba(255,255,255,.08);
  font-size:12px;color:#7D85A3;line-height:1.6}
.side-foot a{color:#B9AEFB;text-decoration:none;font-weight:600}
.side-foot a:hover{text-decoration:underline}

.main{padding:0;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--rule);padding:13px 30px;display:flex;
  align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.period{display:flex;align-items:center;gap:8px}
.period .lbl{font-family:var(--display);font-weight:700;font-size:19px;min-width:152px;text-align:center}
.icobtn{width:32px;height:32px;border:1px solid var(--rule);background:var(--card);border-radius:7px;
  display:grid;place-items:center;font-size:15px;color:var(--muted)}
.icobtn:hover{border-color:var(--accent);color:var(--accent)}
.topright{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.saved{font-family:var(--mono);font-size:11.5px;padding:4px 10px;border-radius:100px;
  background:var(--good-soft);color:var(--good)}
.content{padding:26px 30px;max-width:1200px;flex:1}

/* cards */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--sh);margin-bottom:20px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;
  justify-content:space-between;gap:14px;flex-wrap:wrap}
.card-h h3{font-size:16.5px}
.card-h .sub{font-size:13px;color:var(--muted);margin-top:2px}
.card-b{padding:20px}
.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:9px 15px;
  font-size:13.5px;font-weight:600}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.g{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.g:hover{background:var(--card-2);border-color:var(--accent);color:var(--accent)}
.btn.dark{background:var(--deep);border-color:var(--deep)}
.btn.dark:hover{background:var(--deep-3);border-color:var(--deep-3)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:100px;border:1px solid var(--rule);
  color:var(--muted);white-space:nowrap;display:inline-block}
.pill.good{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pill.info{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
input[type=text],input[type=number],input[type=date],select{border:1px solid var(--rule);background:var(--card);
  border-radius:7px;padding:8px 10px;font-size:13.5px;color:var(--ink);width:100%;font-family:inherit}
input[type=number]{font-family:var(--mono);text-align:right}
input:focus{border-color:var(--accent)}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:14px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;box-shadow:var(--sh)}
.kpi .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.kpi .pair{display:flex;align-items:baseline;gap:10px;margin:8px 0 3px;flex-wrap:wrap}
.kpi .v{font-family:var(--mono);font-weight:700;font-size:25px;letter-spacing:-.03em}
.kpi .p{font-family:var(--mono);font-size:13px;color:var(--faint)}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:linear-gradient(150deg,var(--deep) 0%,var(--deep-3) 120%);border-color:var(--deep);color:#fff}
.kpi.hero .k{color:#9AA2C2}.kpi.hero .v{font-size:30px}.kpi.hero .p{color:#7D85A3}.kpi.hero .d{color:#B9BFD6}

/* flow */
.flow-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.flow-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  width:60px;flex:none;text-align:right}
.flow-track{flex:1;height:26px;border-radius:6px;overflow:hidden;display:flex;background:var(--rule-2);min-width:0}
.flow-track.plan{height:13px;background:transparent;border:1px dashed var(--rule);border-radius:5px;padding:1px;gap:1px}
.seg{height:100%;display:grid;place-items:center;overflow:hidden}
.seg span{font-family:var(--mono);font-size:10.5px;color:#fff;padding:0 6px;white-space:nowrap}
.seg.exp{background:var(--bad)}.seg.sav{background:var(--accent)}.seg.left{background:var(--good)}
.seg.over{background:repeating-linear-gradient(45deg,#D63A2B,#D63A2B 5px,#A82A1E 5px,#A82A1E 10px)}
.flow-track.plan .seg{opacity:.3;border-radius:4px}
.flow-key{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-left:72px}
.flow-key div{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.flow-key i{width:9px;height:9px;border-radius:3px;display:block}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);font-weight:400;padding:9px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tfoot td{font-weight:700;border-top:2px solid var(--rule);border-bottom:0;padding-top:12px}
td.name{font-weight:500}
.bar{height:5px;background:var(--rule-2);border-radius:100px;overflow:hidden;min-width:66px;margin-top:5px}
.bar i{display:block;height:100%;border-radius:100px}
.rowdel{background:none;border:0;color:var(--faint);font-size:16px;padding:2px 6px;line-height:1}
.rowdel:hover{color:var(--bad)}

/* --- the plan grid: category block with line items --- */
.catblock{border:1px solid var(--rule);border-radius:10px;background:var(--card);margin-bottom:14px;
  box-shadow:var(--sh);overflow:hidden}
.cathead{display:grid;grid-template-columns:1fr 118px 118px 132px 34px;gap:10px;align-items:center;
  padding:12px 16px;background:var(--card-2);border-bottom:1px solid var(--rule-2)}
.cathead .cn{font-family:var(--display);font-weight:700;font-size:15.5px}
.cathead .cg{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-top:1px}
.cathead .ct{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:14px}
.colhead{display:grid;grid-template-columns:1fr 118px 118px 132px 34px;gap:10px;padding:7px 16px;
  border-bottom:1px solid var(--rule-2)}
.colhead span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);text-align:right}
.colhead span:first-child{text-align:left}
.line{display:grid;grid-template-columns:1fr 118px 118px 132px 34px;gap:10px;align-items:center;
  padding:8px 16px;border-bottom:1px solid var(--rule-2)}
.line:hover{background:var(--card-2)}
.line input[type=text]{border-color:transparent;background:transparent;padding:6px 8px;font-weight:500}
.line input[type=text]:hover{border-color:var(--rule)}
.line input[type=number]{padding:6px 9px}
.line .diff{text-align:right;font-family:var(--mono);font-size:12.5px}
.addline{padding:9px 16px;background:var(--card-2)}
.addline button{background:none;border:1px dashed var(--rule);color:var(--accent);border-radius:7px;
  padding:7px 13px;font-size:13px;font-weight:600;width:100%;text-align:left}
.addline button:hover{border-color:var(--accent);background:var(--accent-soft)}
.loglink{background:none;border:0;color:var(--faint);font-family:var(--mono);font-size:10.5px;
  padding:0 0 0 8px;text-decoration:underline}
.loglink:hover{color:var(--accent)}
.logbox{padding:2px 16px 12px 16px;background:var(--card-2);border-bottom:1px solid var(--rule-2)}
.logrow{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:11.5px;padding:2px 0;
  color:var(--muted)}
.logrow .ld{flex:1;border-bottom:1px dotted var(--rule)}
.grandtotal{display:grid;grid-template-columns:1fr 118px 118px 132px 34px;gap:10px;align-items:center;
  padding:16px;background:var(--deep);color:#fff;border-radius:10px;margin-top:4px}
.grandtotal .gl{font-family:var(--display);font-weight:700;font-size:16px}
.grandtotal .gv{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:16px}
.grandtotal .gs{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:#8B92AC;text-align:right;display:block;font-weight:400}

/* swaps */
.needs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.need{border:1px solid var(--rule);background:var(--card);border-radius:100px;padding:7px 14px;font-size:13.5px}
.need.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.swap{border:1px solid var(--rule);border-radius:10px;background:var(--card);margin-bottom:14px;box-shadow:var(--sh)}
.swap-h{padding:14px 18px;border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap}
.swap-h .nm{font-family:var(--display);font-weight:700;font-size:16.5px}
.swap-h .pr{font-family:var(--mono);font-size:14px}
.alt{display:grid;grid-template-columns:26px 1fr 140px;gap:12px;align-items:start;padding:12px 18px;
  border-bottom:1px solid var(--rule-2)}
.alt:last-child{border-bottom:0}
.alt.on{background:var(--accent-soft)}
.alt input{width:17px;height:17px;accent-color:var(--accent);margin-top:3px}
.alt .an{font-weight:600}
.alt .at{font-size:12.5px;color:var(--muted);margin-top:2px}
.alt .ap{text-align:right;font-family:var(--mono);white-space:nowrap}
.alt .save{display:block;font-size:11.5px;color:var(--good);margin-top:2px}
.sticky-save{position:sticky;bottom:0;background:var(--deep);color:#fff;border-radius:10px;padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;
  box-shadow:0 -8px 24px -14px rgba(23,26,43,.6)}
.sticky-save .t{font-size:13.5px;color:#9AA2C2}
.sticky-save .v{font-family:var(--mono);font-weight:700;font-size:24px}

/* import */
.drop{border:1.5px dashed var(--rule);border-radius:10px;background:var(--card-2);padding:36px 20px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.radios{display:flex;flex-wrap:wrap;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule-2)}
.radio{display:flex;align-items:center;gap:7px;font-size:13.5px}
.radio input{accent-color:var(--accent)}
.note{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:12px 14px;
  font-size:13px;color:#6C4F07;margin-bottom:16px}
.errbox{background:var(--bad-soft);border:1px solid var(--bad-line);border-radius:8px;padding:11px 14px;
  font-size:13.5px;color:#8C2318;margin-top:14px}

.spark{width:100%;height:70px;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;
  padding:11px 20px;border-radius:100px;font-size:13.5px;z-index:100;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 12px 30px -12px rgba(23,26,43,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* exchange rate notice */
.ratebox{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;
  margin-bottom:18px;box-shadow:var(--sh);display:grid;grid-template-columns:1fr 260px;gap:18px}
.ratebox .rl{font-size:13.5px;color:var(--muted);line-height:1.6}
.ratebox .rl b{color:var(--ink)}
.ratebox .ri{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px}
.ratebox .ri input{width:110px}
.ratebox .rn{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.5}
@media(max-width:820px){.ratebox{grid-template-columns:1fr}}

/* inbox */
.inbanner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;
  padding:14px 18px;margin-bottom:20px}
.inbanner .it{font-size:14px;color:#3B2FA8}
.inbanner .it b{font-family:var(--display);font-size:15.5px}
.pend{display:grid;grid-template-columns:1fr 120px 150px 170px auto auto;gap:10px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--rule-2)}
.pend:last-of-type{border-bottom:0}
.pend .pm{font-weight:600}
.pend .pu{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.pend .pa{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.badge.hot{background:var(--accent);color:#fff;border-radius:100px;padding:1px 7px;font-weight:700}
@media(max-width:980px){.pend{grid-template-columns:1fr 1fr}}

/* credit */
.credit{border-top:1px solid var(--rule);background:var(--card);padding:20px 30px;display:flex;
  justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.credit a{color:var(--accent);font-weight:600;text-decoration:none}
.credit a:hover{text-decoration:underline}
.credit .made{display:flex;align-items:center;gap:8px}
.credit .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}

@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding-bottom:12px}

function detectDelimiter(t){
  const s=t.split(/\r?\n/).slice(0,12).join("\n");
  let best=",",bs=-1;
  for(const d of [",",";","\t","|"]){
    let q=false,c=0;
    for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='"'){q=!q;continue;}if(!q&&ch===d)c++;}
    if(c>bs){bs=c;best=d;}
  }
  return best;
}
function parseCSV(text,delim){
  text=String(text).replace(/^\uFEFF/,"");
  const d=delim||detectDelimiter(text);
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===d){row.push(f);f="";}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}
    else if(c==='\r'){}
    else f+=c;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.map(r=>r.map(v=>v.trim())).filter(r=>r.some(v=>v!==""));
}
function parseAmount(raw){
  if(raw===null||raw===undefined)return null;
  let s=String(raw).trim();if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(/-\s*$/.test(s)){neg=true;s=s.replace(/-\s*$/,"");}
  s=s.replace(/[^\d.,\-]/g,"");
  if(!s||!/\d/.test(s))return null;
  if(/^-/.test(s))neg=true;
  s=s.replace(/-/g,"");
  const ld=s.lastIndexOf("."),lc=s.lastIndexOf(",");
  if(ld>-1&&lc>-1){ s = lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lc>-1){ const t=s.length-lc-1; s=(t===1||t===2)?s.replace(",","."):s.replace(/,/g,""); }
  else if(ld>-1){ const t=s.length-ld-1; if(t===3&&(s.match(/\./g)||[]).length>1)s=s.replace(/\./g,""); }
  const n=parseFloat(s);
  return isNaN(n)?null:(neg?-n:n);
}
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function mkDate(y,m,d){
  if(y<100)y+=(y>70?1900:2000);
  if(m<0||m>11||d<1||d>31||y<1900||y>2200)return null;
  const dt=new Date(Date.UTC(y,m,d));
  return (dt.getUTCMonth()===m&&dt.getUTCDate()===d)?dt:null;
}
function parseDate(raw,fmt){
  if(raw===null||raw===undefined)return null;
  const s=String(raw).trim();
  if(!s||s.length<6)return null;
  let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return mkDate(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\s\-\/.]([A-Za-z]{3,9})[\s\-\/.](\d{2,4})/))){
    const mo=MONTHS[m[2].slice(0,4).toLowerCase()]??MONTHS[m[2].slice(0,3).toLowerCase()];
    return mo===undefined?null:mkDate(+m[3],mo,+m[1]);
  }
  if((m=s.match(/^([A-Za-z]{3,9})[\s\-\/.](\d{1,2}),?[\s\-\/.]*(\d{2,4})/))){
    const mo=MONTHS[m[1].slice(0,4).toLowerCase()]??MONTHS[m[1].slice(0,3).toLowerCase()];
    return mo===undefined?null:mkDate(+m[3],mo,+m[2]);
  }
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){
    const a=+m[1],b=+m[2],y=+m[3];
    if(fmt==='dmy')return mkDate(y,b-1,a);
    if(fmt==='mdy')return mkDate(y,a-1,b);
    if(a>12&&b<=12)return mkDate(y,b-1,a);
    if(b>12&&a<=12)return mkDate(y,a-1,b);
    return mkDate(y,a-1,b);
  }
  return null;
}
function guessDateOrder(vals){
  let d=0,m=0;
  for(const v of vals){
    const x=String(v).trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if(!x)continue;
    if(+x[1]>12)d++;
    if(+x[2]>12)m++;
  }
  if(d>0&&m===0)return 'dmy';
  if(m>0&&d===0)return 'mdy';
  return 'auto';
}
const HEAD={
  date:/^(date|dates|posted|post date|transaction date|trans date|booking date|value date)/i,
  desc:/(descri|merchant|payee|details|narrative|memo|particular|reference|name|transaction)/i,
  amount:/^(amount|amt|value|sum|total)/i,
  debit:/(debit|withdraw|money out|paid out|outflow|expense|spent)/i,
  credit:/(credit|deposit|money in|paid in|inflow|received)/i
};
function findHeaderRow(rows){
  const counts={};
  rows.slice(0,60).forEach(r=>{counts[r.length]=(counts[r.length]||0)+1;});
  let width=0,best=0;
  for(const k in counts){ if(counts[k]>best||(counts[k]===best&&+k>width)){best=counts[k];width=+k;} }
  for(let i=0;i<Math.min(rows.length,40);i++){
    if(rows[i].length===width){
      const nums=rows[i].filter(c=>parseAmount(c)!==null).length;
      const dts=rows[i].filter(c=>parseDate(c,'auto')!==null).length;
      return {index:i,width,hasHeader:(nums===0&&dts===0)};
    }
  }
  return {index:0,width,hasHeader:false};
}
function guessColumns(headers,rows){
  const g={date:-1,desc:-1,amount:-1,debit:-1,credit:-1};
  headers.forEach((h,i)=>{
    const t=String(h).trim();
    if(g.date<0&&HEAD.date.test(t))g.date=i;
    if(g.debit<0&&HEAD.debit.test(t))g.debit=i;
    if(g.credit<0&&HEAD.credit.test(t))g.credit=i;
    if(g.amount<0&&HEAD.amount.test(t))g.amount=i;
    if(g.desc<0&&HEAD.desc.test(t)&&!HEAD.date.test(t))g.desc=i;
  });
  const sample=rows.slice(0,40),stat=[];
  for(let i=0;i<headers.length;i++){
    let dates=0,nums=0,tl=0;
    for(const r of sample){
      const v=r[i];
      if(v===undefined||v==="")continue;
      if(parseDate(v,'auto'))dates++;
      else if(parseAmount(v)!==null&&/\d/.test(v))nums++;
      else tl+=String(v).length;
    }
    stat.push({i,dates,nums,tl});
  }
  if(g.date<0){const c=stat.slice().sort((a,b)=>b.dates-a.dates)[0];if(c&&c.dates>0)g.date=c.i;}
  if(g.desc<0){const c=stat.slice().sort((a,b)=>b.tl-a.tl)[0];if(c&&c.tl>0)g.desc=c.i;}
  if(g.amount<0){
    const c=stat.filter(s=>s.i!==g.date&&s.i!==g.desc).sort((a,b)=>b.nums-a.nums)[0];
    if(c&&c.nums>0)g.amount=c.i;
  }
  return g;
}
const PREFIXES=[
  /^SQ\s*\*/i,/^TST\s*\*/i,/^SP\s+/i,/^PAYPAL\s*\*/i,/^PP\s*\*/i,/^PY\s*\*/i,
  /^POS\s+(DEBIT\s+)?/i,/^DEBIT\s+CARD\s+(PURCHASE|PAYMENT)\s*[-:]?\s*/i,
  /^CARD\s+(PURCHASE|PAYMENT)(\s+TO)?\s*[-:]?\s*/i,/^CHECKCARD\s+\d*\s*/i,
  /^VISA\s+(PURCHASE|DEBIT|DIRECT\s+DEBIT)?\s*/i,/^MASTERCARD\s+/i,
  /^RECURRING\s+(PAYMENT|DEBIT|CHARGE|TRANSFER)\s*[-:]?\s*/i,
  /^ACH\s+(DEBIT|WEB|PMT|PAYMENT)?\s*/i,/^AUTOPAY\s*[-:]?\s*/i,
  /^DIRECT\s+DEBIT\s*[-:]?\s*/i,/^STANDING\s+ORDER\s*[-:]?\s*/i,
  /^PURCHASE\s+AUTHORIZED\s+ON\s+\d{1,2}\/\d{1,2}\s*/i,
  /^(WWW\.|HTTPS?:\/\/)/i,/^EIG\s*\*/i,/^WL\s*\*/i,/^IN\s*\*/i,/^DD\s*\*/i
];
const BRANDS=[
  [/AMAZON\s*PRIME|PRIME\s*VIDEO|AMZN\s*PRIME/i,"Amazon Prime"],
  [/^AMZN\s*MKTP|^AMAZON(\s|\.|$)|^AMZN\b/i,"Amazon"],
  [/APPLE\.?COM\/?BILL|^APL\s*\*|^APPLE\b/i,"Apple"],
  [/YOUTUBE\s*\*?\s*PREMIUM|YOUTUBEPREMIUM/i,"YouTube Premium"],
  [/GOOGLE\s*\*?\s*(ONE|STORAGE)\b/i,"Google One"],
  [/^GOOGLE\b|^GOOGLE\s*\*/i,"Google"],
  [/MSFT\s*\*|MICROSOFT\s*365|^MICROSOFT\b/i,"Microsoft"],
  [/NETFLIX/i,"Netflix"],[/SPOTIFY/i,"Spotify"],[/ADOBE/i,"Adobe"],
  [/^DROPBOX\b|DROPBOX\*/i,"Dropbox"],[/^UBER\s*\*?\s*EATS/i,"Uber Eats"],[/^UBER\b/i,"Uber"],
  [/^HULU\b/i,"Hulu"],[/DISNEY\s*(PLUS|\+)?/i,"Disney+"],[/AUDIBLE/i,"Audible"],
  [/PLANET\s*FIT/i,"Planet Fitness"],[/ANYTIME\s*FIT/i,"Anytime Fitness"],
  [/SIRIUS\s*XM|SIRIUSXM/i,"SiriusXM"],[/COMCAST|XFINITY/i,"Xfinity"],[/VERIZON/i,"Verizon"]
];
const KEEP_CAPS=new Set(["BBC","HBO","NYT","IBM","KFC","MTA","DMV","CVS","AMC","NBC","ABC","CBS","ESPN","BP","TV","PC","UK","EU","US","IT"]);
function brandHit(s){ for(const b of BRANDS){ if(b[0].test(s)) return b[1]; } return null; }
function cleanMerchant(raw){
  if(!raw)return "Unknown";
  let s=String(raw).trim(),ch=true,g=0;
  while(ch&&g++<6){ ch=false; for(const p of PREFIXES){ if(p.test(s)){s=s.replace(p,"");ch=true;} } }
  const hit=brandHit(s)||brandHit(String(raw));
  if(hit)return hit;
  s=s.replace(/\b\d{3}[-.\s]?\d{3}[-.\s]?\d{4}\b/g," ")
     .replace(/\b\d{1,2}[\/\-]\d{1,2}([\/\-]\d{2,4})?\b/g," ")
     .replace(/[#*]\s?[A-Za-z0-9]{2,}/g," ")
     .replace(/\b(?=[A-Za-z0-9]*\d[A-Za-z0-9]*\d)(?=[A-Za-z0-9]*[A-Za-z])[A-Za-z0-9]{4,}\b/g," ")
     .replace(/\bX{2,}\d*\b/gi," ").replace(/\b\d{4,}\b/g," ")
     .replace(/\.(COM|NET|ORG|CO|IO|APP|TV|ME|LK|RU|UK)\b/gi," ")
     .replace(/[^A-Za-z0-9&'’\- ]/g," ").replace(/\s+/g," ").trim();
  for(let i=0;i<4;i++){
    s=s.replace(/\s+(USA|USD|GBR|GBP|EUR|INTL|INC|LLC|LTD|LIMITED|CORP|STORE)$/i,"")
       .replace(/\s+\d{1,4}(ST|ND|RD|TH)$/i,"").replace(/\s+[A-Z]{2}$/,"")
       .replace(/\s+\d{1,3}$/,"").replace(/\s*[-–]\s*$/,"").trim();
  }
  if(!s)s=(String(raw).replace(/[^A-Za-z ]/g," ").trim().split(/\s+/)[0]||"Unknown");
  return s.split(" ").map(w=>KEEP_CAPS.has(w.toUpperCase())?w.toUpperCase()
    :w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");
}
const RULES=[
  [/netflix|hulu|disney|spotify|youtube premium|siriusxm|audible|prime video|hbo|max\b|paramount|peacock|apple tv/i,'streaming'],
  [/adobe|microsoft|google one|dropbox|icloud|figma|canva|notion|slack|zoom|godaddy|namecheap|vercel|hosting/i,'software'],

  [/grocer|market|supermarket|tesco|aldi|lidl|kroger|safeway|walmart|trader joe|whole ?foods|sainsbury|costco/i,'groceries'],

function autoCategory(text){
  const t=String(text||"");

const periodOf=iso=>String(iso).slice(0,7);
function shiftMonth(period,delta){
  const [y,m]=period.split("-").map(Number);

}
function monthsBack(period,n){
  const [y,m]=period.split("-").map(Number);
  const out=[];
  for(let i=n-1;i>=0;i--) out.push(new Date(Date.UTC(y,m-1-i,1)).toISOString().slice(0,7));
  return out;
}

/* ---- budget maths over line items ----
   Every line has its own planned and actual figure. Category and grand
   totals are just sums, so the two plans always stay in step. */
function computeTotals(state,period){
  const items=state.items.filter(i=>i.period===period);
  const byCat={}, byType={income:{planned:0,actual:0},expense:{planned:0,actual:0},saving:{planned:0,actual:0}};
  items.forEach(i=>{
    const p=+i.planned||0, a=+i.actual||0;
    if(!byCat[i.catId])byCat[i.catId]={planned:0,actual:0,items:[]};
    byCat[i.catId].planned+=p; byCat[i.catId].actual+=a; byCat[i.catId].items.push(i);
    if(!byType[i.type])byType[i.type]={planned:0,actual:0};
    byType[i.type].planned+=p; byType[i.type].actual+=a;
  });
  return {
    items, byCat, byType,
    resultPlanned: byType.income.planned-byType.expense.planned-byType.saving.planned,
    resultActual:  byType.income.actual -byType.expense.actual -byType.saving.actual
  };
}
/* Expenses want actual at or under plan. Income and savings want the opposite. */
function varianceStatus(type,plan,actual){
  const diff=actual-plan;
  if(!plan&&!actual)return {label:"—",kind:"",diff:0};
  if(!plan)return {label:"no plan set",kind:"warn",diff};
  const pct=diff/plan;
  if(type==='expense'){
    if(pct>0.02)return {label:"over by "+Math.round(pct*100)+"%",kind:"bad",diff};
    if(pct<-0.02)return {label:"under by "+Math.round(-pct*100)+"%",kind:"good",diff};
  } else {
    if(pct<-0.02)return {label:"short by "+Math.round(-pct*100)+"%",kind:"bad",diff};
    if(pct>0.02)return {label:"ahead by "+Math.round(pct*100)+"%",kind:"good",diff};
  }
  return {label:"on plan",kind:"good",diff};
}
/* Old saves stored dated entries and category-level plans. Fold them into lines. */
function migrate(old,newId){
  if(!old)return null;
  if(old.items)return old;
  if(!old.entries)return null;
  const items=[],idx={};
  (old.entries||[]).forEach(e=>{
    const period=periodOf(e.date);
    const name=e.label||"Item";
    const key=period+"|"+e.catId+"|"+name;
    if(!idx[key]){
      idx[key]={id:newId(),period,type:e.type,catId:e.catId,name,planned:0,actual:0,log:[]};
      items.push(idx[key]);
    }
    idx[key].actual+=e.amount;
    idx[key].log.push({date:e.date,label:e.label,amount:e.amount});
  });
  const plans=old.plans||{};
  Object.keys(plans).forEach(period=>{
    Object.keys(plans[period]).forEach(catId=>{
      const val=+plans[period][catId]||0;
      if(!val)return;
      const mine=items.filter(i=>i.period===period&&i.catId===catId);
      if(mine.length){ mine[0].planned+=val; }
      else{
        const cat=(old.cats||[]).find(c=>c.id===catId);
        items.push({id:newId(),period,type:cat?cat.type:'expense',catId,
          name:cat?cat.name:'Planned',planned:val,actual:0,log:[]});
      }
    });
  });
  return {v:2,cur:old.cur||"$",cats:old.cats||[],items,switches:old.switches||{}};
}

(function(){
if(typeof document==='undefined')return;
const $=s=>document.querySelector(s);
const KEY='undermark.v1';
const LEGACY_KEYS=['ledger.v2','ledger.v1'];
let storageOK=true, memory=null;
function uid(){ return Math.random().toString(36).slice(2,9); }

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)return JSON.parse(raw);
    for(const k of LEGACY_KEYS){
      const old=localStorage.getItem(k);
      if(old){ const mg=migrate(JSON.parse(old),uid); if(mg)return mg; }
    }
    return null;
  }catch(e){ storageOK=false; return memory; }
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(e){ storageOK=false; memory=JSON.parse(JSON.stringify(state)); }
  flash();
}
function flash(){
  const el=$("#savestate");
  el.textContent=storageOK?"Saved":"In memory only";
  el.style.background=storageOK?"var(--good-soft)":"var(--warn-soft)";
  el.style.color=storageOK?"var(--good)":"var(--warn)";
}

/* ---------- purchase inbox ----------
   The Chrome extension never touches Under the Mark's own data. It appends to a
   separate localStorage key and Under the Mark decides what to do with it, so the
   two can change independently. Contract: an array of
   {id, ts, merchant, amount, currency, url, source}. */
const INBOX_KEY='undermark.inbox';
const INBOX_LEGACY='ledger.inbox';
let inbox=[];
function readInbox(){
  const out=[];
  // Read the current key plus the old one, so an extension that has not been
  // updated yet still gets its purchases through.
  for(const key of [INBOX_KEY,INBOX_LEGACY]){
    let raw=null;
    try{ raw=localStorage.getItem(key); }catch(e){ continue; }
    if(!raw)continue;
    let arr;
    try{ arr=JSON.parse(raw); }catch(e){ continue; }
    if(!Array.isArray(arr))continue;
    arr.filter(isPending).map(normalisePending).forEach(p=>{
      if(!out.some(x=>x.id===p.id))out.push(p);
    });
  }
  return out;
}
function isPending(p){
  return p && typeof p==='object' && p.id!==undefined &&
    p.merchant!==undefined && isFinite(parseFloat(p.amount)) && parseFloat(p.amount)>0;
}
function normalisePending(p){
  const amount=Math.abs(parseFloat(p.amount))||0;
  let iso=String(p.ts||"").slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) iso=new Date().toISOString().slice(0,10);
  const merchant=String(p.merchant||"Unknown").slice(0,80).trim()||"Unknown";
  return {id:String(p.id),ts:iso,merchant,amount,
    currency:String(p.currency||"").slice(0,4),url:String(p.url||"").slice(0,300),
    source:p.source==='auto'?'auto':'manual', note:String(p.note||"").slice(0,120)};
}
function writeInbox(arr){
  try{
    localStorage.setItem(INBOX_KEY,JSON.stringify(arr));
    // Anything read from the old key has now been carried into the new one,
    // so empty the old one or accepted purchases would come back.
    if(localStorage.getItem(INBOX_LEGACY)!==null)
      localStorage.setItem(INBOX_LEGACY,'[]');
  }catch(e){}
  inbox=arr;
}
function refreshInbox(rerender){
  const next=readInbox();
  const changed = next.length!==inbox.length ||
    next.some((p,i)=>!inbox[i]||inbox[i].id!==p.id);
  inbox=next;
  if(changed&&rerender!==false)render();
  return changed;
}
function guessPendingCat(p){
  const g=autoCategory(p.merchant+" "+(p.url||""));
  if(g&&catById(g)&&catById(g).type==='expense')return g;
  return catById('shopping')?'shopping':(catsOf('expense')[0]||{}).id;
}
function acceptPending(p,catId){
  const period_=periodOf(p.ts);
  const cid=catId||guessPendingCat(p);
  const c=catById(cid);
  if(!c)return false;
  const hit=state.items.find(i=>i.period===period_&&i.catId===cid&&
    String(i.name||"").toLowerCase()===p.merchant.toLowerCase());
  const log={date:p.ts,label:(p.note||p.url||'from extension'),amount:p.amount};
  if(hit){ hit.actual=(+hit.actual||0)+p.amount; hit.log=(hit.log||[]).concat([log]); }
  else state.items.push({id:uid(),period:period_,type:'expense',catId:cid,
    name:p.merchant,planned:0,actual:p.amount,log:[log]});
  return true;
}
function dropPending(id){ writeInbox(inbox.filter(p=>p.id!==id)); }

function viewPlan(type,T){
  const title={income:'Income',expense:'Expenses',saving:'Savings'}[type];
  const word={income:'source',expense:'category',saving:'goal'}[type];
  const cats=catsOf(type);
  const groups={};
  cats.forEach(c=>{(groups[c.group||'Other']=groups[c.group||'Other']||[]).push(c);});

  let blocks="";
  Object.keys(groups).forEach(gname=>{
    const visible=groups[gname].filter(c=>!state.hideEmpty||itemsOf(c.id).length);
    if(!visible.length)return;
    blocks+='<div style="font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;'+
      'color:var(--faint);margin:18px 0 8px">'+esc(gname)+'</div>';
    groups[gname].forEach(c=>{
      const items=itemsOf(c.id);
      if(state.hideEmpty&&!items.length)return;
      const cp=items.reduce((s,i)=>s+(+i.planned||0),0);
      const ca=items.reduce((s,i)=>s+(+i.actual||0),0);
      const st=varianceStatus(type,cp,ca);
      const dcol=st.kind==='bad'?'var(--bad)':st.kind==='good'?'var(--good)':'var(--muted)';
      blocks+='<div class="catblock">'+
        '<div class="cathead"><div><div class="cn">'+esc(c.name)+'</div>'+
          '<div class="cg">'+items.length+' line'+(items.length===1?'':'s')+'</div></div>'+
          '<div class="ct">'+money(cp)+'</div><div class="ct">'+money(ca)+'</div>'+
          '<div class="ct cd" style="color:'+dcol+'">'+(cp||ca?money(st.diff):'—')+'</div>'+
          '<div class="num"><button class="rowdel" data-delcat="'+c.id+'" title="Remove category">×</button></div></div>';
      if(items.length){
        blocks+='<div class="colhead"><span>Line</span><span>Planned</span><span>Actual</span><span>Difference</span><span></span></div>';
        items.forEach(it=>{
          const d=(+it.actual||0)-(+it.planned||0);
          const good = type==='expense' ? d<=0 : d>=0;
          const dc=(!it.planned&&!it.actual)?'var(--faint)':(good?'var(--good)':'var(--bad)');
          blocks+='<div class="line">'+
            '<input type="text" data-f="name-'+it.id+'" data-name="'+it.id+'" value="'+esc(it.name)+'" placeholder="What is it?">'+
            '<input type="number" step="0.01" data-planned="'+it.id+'" value="'+(it.planned||"")+'" placeholder="0">'+
            '<input type="number" step="0.01" data-actual="'+it.id+'" value="'+(it.actual||"")+'" placeholder="0">'+
            '<div class="diff" style="color:'+dc+'">'+((it.planned||it.actual)?money(d):'—')+
              (it.log&&it.log.length?'<button class="loglink" data-log="'+it.id+'">'+it.log.length+' txn</button>':'')+
            '</div>'+
            '<div class="num"><button class="rowdel" data-delitem="'+it.id+'" title="Delete line">×</button></div>'+
          '</div>';
          if(openLogs[it.id]&&it.log&&it.log.length){
            blocks+='<div class="logbox">'+it.log.map(l=>
              '<div class="logrow"><span>'+esc(l.date)+'</span><span>'+esc(l.label||'')+'</span>'+
              '<span class="ld"></span><span>'+esc(money(l.amount))+'</span></div>').join("")+'</div>';
          }
        });
      }
      blocks+='<div class="addline"><button data-additem="'+c.id+'">+ Add a line under '+esc(c.name)+'</button></div>';
      blocks+='</div>';

/* ---------- cheaper options ---------- */
function findLeaks(T){
  const r=rate(), out=[], seen={};
  T.items.filter(i=>i.type==='expense').forEach(i=>{
    SERVICES.forEach(s=>{
      if(!s.match.test(i.name||""))return;
      if(seen[s.n])return;
      const best=s.alts.slice().sort((a,b)=>a.p-b.p)[0];
      if(!best)return;
      const paid=(+i.actual||+i.planned||0);
      seen[s.n]=true;
      if(r>0&&paid>0){
        const altInYourMoney=best.p*r;
        if(altInYourMoney>=paid)return;
        out.push({svc:s,best,item:i,paid,altInYourMoney,cmp:true,
          saveMonth:paid-altInYourMoney,saveYear:(paid-altInYourMoney)*12});
      } else {
        out.push({svc:s,best,item:i,paid,cmp:false,saveMonth:0,saveYear:0});
      }
    });
  });
  return out.sort((a,b)=>b.saveYear-a.saveYear);
}

function groupMapped(){
  if(csv.groups)return csv.groups;
  const idx={},out=[];
  csv.mapped.forEach(r=>{
    const key=r.period+"|"+r.type+"|"+r.name;
    if(!idx[key]){ idx[key]={period:r.period,type:r.type,catId:r.catId,name:r.name,actual:0,log:[]}; out.push(idx[key]); }
    idx[key].actual+=r.amount;
    idx[key].log.push({date:r.date,label:r.raw,amount:r.amount});
  });
  out.sort((a,b)=>b.period.localeCompare(a.period)||b.actual-a.actual);
  csv.groups=out;
  return out;
}
function wireImport(){
  const drop=$("#drop"); if(!drop)return;
  const fi=$("#file");
  $("#pick").onclick=e=>{e.stopPropagation();fi.click();};
  drop.onclick=()=>fi.click();
  $("#demo").onclick=e=>{e.stopPropagation();ingest(sampleCSV());};
  fi.onchange=()=>{ if(fi.files[0]){const r=new FileReader();r.onload=()=>ingest(String(r.result));r.readAsText(fi.files[0]);} };
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>{
    const f=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f){const r=new FileReader();r.onload=()=>ingest(String(r.result));r.readAsText(f);}
  });
}
function ingest(text){
  const rows=parseCSV(text);
  if(rows.length<3){ $("#imperr").innerHTML='<div class="errbox">Only '+rows.length+' rows found. Make sure the file is saved as CSV.</div>'; return; }
  const h=findHeaderRow(rows), all=rows.slice(h.index);
  csv.headers=h.hasHeader?all[0].map((c,i)=>c||("Column "+(i+1))):all[0].map((c,i)=>"Column "+(i+1));
  csv.body=h.hasHeader?all.slice(1):all;
  csv.guess=guessColumns(csv.headers,csv.body);
  csv.dfmt=csv.guess.date>-1?guessDateOrder(csv.body.map(r=>r[csv.guess.date])):'auto';
  const vals=csv.guess.amount>-1?csv.body.map(r=>parseAmount(r[csv.guess.amount])).filter(v=>v!==null):[];
  csv.sign=vals.filter(v=>v<0).length>vals.length*0.25?'neg':'pos';
  csv.mapped=null; csv.groups=null;
  render();
}
function doMap(){
  const di=+$("#c-date").value, si=+$("#c-desc").value, ai=+$("#c-amt").value;
  csv.sign=document.querySelector('input[name=sg]:checked').value;
  csv.dfmt=document.querySelector('input[name=df]:checked').value;
  if(di<0||si<0||ai<0){ $("#imperr").innerHTML='<div class="errbox">Pick a date, description and amount column first.</div>'; return; }
  const out=[];
  csv.body.forEach(r=>{
    const d=parseDate(r[di],csv.dfmt); if(!d)return;
    let a=parseAmount(r[ai]); if(a===null)return;
    const outflow = csv.sign==='neg' ? a<0 : a>0;
    a=Math.abs(a); if(!a)return;
    const name=cleanMerchant(r[si]);
    const guess=autoCategory(r[si]);
    let type=outflow?'expense':'income', catId;
    if(guess&&catById(guess)){ catId=guess; type=catById(guess).type; }
    else catId = type==='income'?'otherinc':'otherexp';
    const iso=d.toISOString().slice(0,10);
    out.push({date:iso,period:periodOf(iso),name,amount:a,type,catId,raw:r[si]});
  });
  if(!out.length){ $("#imperr").innerHTML='<div class="errbox">No usable rows. Check whether money leaving the account is negative or positive.</div>'; return; }
  csv.mapped=out; csv.groups=null;
  render();
}
function doImport(){
  const groups=groupMapped().filter(g=>g.type!=='skip');
  let added=0,merged=0;
  groups.forEach(g=>{
    const hit=state.items.find(i=>i.period===g.period&&i.catId===g.catId&&i.name.toLowerCase()===g.name.toLowerCase());
    if(hit){ hit.actual=(+hit.actual||0)+g.actual; hit.log=(hit.log||[]).concat(g.log); merged++; }
    else{ state.items.push({id:uid(),period:g.period,type:g.type,catId:g.catId,name:g.name,
      planned:0,actual:g.actual,log:g.log}); added++; }
  });
  csv={headers:null,body:null,mapped:null,guess:null,dfmt:'auto',sign:'neg'};
  save(); page='expenses'; render();
  toast(added+" lines added"+(merged?", "+merged+" merged":""));
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-nav],[data-act],[data-addcat],[data-delcat],[data-additem],[data-delitem],[data-need],[data-copyplan],[data-gdel],[data-log],[data-accept],[data-dismiss]");
  if(!t)return;
  const d=t.dataset;
  if(d.nav){ page=d.nav; render(); window.scrollTo({top:0}); return; }
  if(d.need){ viewSwaps._need=d.need; render(); return; }
  if(d.log){ openLogs[d.log]=!openLogs[d.log]; render(); return; }
  if(d.additem){ addItem(d.additem); return; }
  if(d.delitem){ state.items=state.items.filter(i=>i.id!==d.delitem); save(); render(); return; }
  if(d.addcat){ addCat(d.addcat); return; }
  if(d.delcat){ delCat(d.delcat); return; }
  if(d.copyplan){ copyPlan(d.copyplan); return; }
  if(d.gdel){ csv.groups.splice(+d.gdel,1); render(); return; }
  if(d.accept){
    const p=inbox.find(x=>x.id===d.accept);
    if(p){
      const row=t.closest('.pend');
      const sel=row?row.querySelector('select[data-pcat]'):null;
      if(acceptPending(p,sel?sel.value:null)){
        dropPending(p.id); save(); render();
        toast(p.merchant+" added to "+periodLabel(periodOf(p.ts)));
      } else toast("That category no longer exists");
    }
    return;
  }
  if(d.dismiss){ dropPending(d.dismiss); render(); toast("Dismissed"); return; }
  const a=d.act;
  if(a==='prev-month'){ period=shiftMonth(period,-1); render(); }
  else if(a==='next-month'){ period=shiftMonth(period,1); render(); }
  else if(a==='this-month'){ period=new Date().toISOString().slice(0,7); render(); }
  else if(a==='do-map'){ doMap(); }
  else if(a==='cancel-import'){ csv={headers:null,body:null,mapped:null,guess:null,dfmt:'auto',sign:'neg'}; render(); }
  else if(a==='do-import'){ doImport(); }
  else if(a==='apply-swaps'){ applySwaps(); }
  else if(a==='export'){ exportJSON(); }
  else if(a==='export-csv'){ exportCSV(); }
  else if(a==='import-json'){ $("#jsonfile").click(); }
  else if(a==='accept-all'){
    let n=0;
    inbox.slice().forEach(p=>{ if(acceptPending(p,null))n++; });
    writeInbox([]); save(); page='expenses'; render();
    toast(n+" purchase"+(n===1?'':'s')+" added");
  }
  else if(a==='clear-inbox'){
    if(confirm("Dismiss all "+inbox.length+" waiting purchases? They will not be added."))
      { writeInbox([]); render(); toast("Inbox cleared"); }
  }
  else if(a==='reset'){ if(confirm("Delete every line, plan and category? This cannot be undone.")){
    state=defaultState(); save(); render(); toast("Everything cleared"); } }
});

/* The extension writes to localStorage then fires this event. We re-read the
   store rather than trusting anything carried on the event itself. */
window.addEventListener('ledger:inbox',()=>refreshInbox());
window.addEventListener('storage',e=>{ if(!e.key||e.key===INBOX_KEY)refreshInbox(); });
window.addEventListener('focus',()=>refreshInbox());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)refreshInbox(); });
document.addEventListener("change",e=>{
  const el=e.target, d=el.dataset;
  if(el.id==='curSel'){ setCurrency(el.value,$("#curCustom").value); return; }
  if(el.id==='curCustom'){ setCurrency('OTHER',el.value); return; }
  if(el.id==='usdrate'){
    const v=parseFloat(el.value);
    state.usdRate=(isFinite(v)&&v>0)?v:0;
    save(); render();
    toast(state.usdRate?("Using 1 USD = "+state.usdRate+" "+curCode()):"Rate cleared");
    return;
  }
  if(el.id==='hideEmpty'){ state.hideEmpty=el.checked; save(); render(); return; }
  if(d.name){ const it=state.items.find(i=>i.id===d.name); if(it){it.name=el.value;save();} return; }
  if(d.planned){ const it=state.items.find(i=>i.id===d.planned); if(it){it.planned=parseFloat(el.value)||0;save();render();} return; }
  if(d.actual){ const it=state.items.find(i=>i.id===d.actual); if(it){it.actual=parseFloat(el.value)||0;save();render();} return; }
  if(d.swap){ state.switches[d.swap]=el.checked; save(); render(); return; }
  if(d.gtype!==undefined){
    const g=csv.groups[+d.gtype]; g.type=el.value;
    if(el.value!=='skip'){
      const c=catById(g.catId);
      if(!c||c.type!==el.value)g.catId=(state.cats.find(x=>x.type===el.value)||{}).id;
    }
    render(); return;
  }
  if(d.gcat!==undefined){ csv.groups[+d.gcat].catId=el.value; return; }
  if(el.id==='jsonfile'&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        let dd=JSON.parse(String(r.result));
        if(dd.entries&&!dd.items)dd=migrate(dd,uid);
        if(!dd||!dd.cats||!dd.items)throw 0;
        state=dd; if(!state.switches)state.switches={};
        save(); render(); toast("Backup restored");
      }catch(err){ toast("That file is not an Under the Mark backup"); }
    };
    r.readAsText(el.files[0]);
  }
});

/* ---------- actions ---------- */
function addItem(catId){
  const c=catById(catId); if(!c)return;
  const it={id:uid(),period,type:c.type,catId,name:"",planned:0,actual:0,log:[]};
  state.items.push(it);
  focusId=it.id;
  save(); render();
}
function addCat(type){
  const n=$("#newcat"), g=$("#newgrp");
  const name=(n.value||"").trim();
  if(!name){ toast("Give it a name first"); n.focus(); return; }
  state.cats.push({id:uid(),type,name,group:(g.value||"").trim()||"Other"});
  n.value=""; g.value="";
  save(); render(); toast("Added");
}
function delCat(id){
  const used=state.items.filter(i=>i.catId===id).length;
  if(used&&!confirm(used+" lines sit under this. Delete the category and its lines?"))return;
  state.cats=state.cats.filter(c=>c.id!==id);
  state.items=state.items.filter(i=>i.catId!==id);
  save(); render();
}
function copyPlan(type){
  const prev=shiftMonth(period,-1);
  const src=state.items.filter(i=>i.period===prev&&i.type===type);
  if(!src.length){ toast("Nothing in "+periodLabel(prev)+" to copy"); return; }
  let n=0;
  src.forEach(s=>{
    const exists=state.items.some(i=>i.period===period&&i.catId===s.catId&&i.name.toLowerCase()===s.name.toLowerCase());
    if(exists)return;
    state.items.push({id:uid(),period,type:s.type,catId:s.catId,name:s.name,
      planned:(+s.planned||+s.actual||0),actual:0,log:[]});
    n++;
  });
  save(); render();
  toast(n?("Copied "+n+" lines from "+periodLabel(prev)+" — actuals left blank"):"Those lines already exist");
}
function applySwaps(){
  /* Database prices are in USD. Never write them into a budget kept in
     another currency without the rate the user supplied themselves. */
  if(!canCompare()){ toast("Set a 1 USD rate first so the amounts land in "+curCode()); return; }
  const T=computeTotals(state,period);
  const next=shiftMonth(period,1);
  const r=rate();
  let count=0,total=0;
  SERVICES.forEach(s=>{
    s.alts.forEach(a=>{
      if(!state.switches[s.n+"::"+a.n])return;
      const mine=T.items.find(i=>i.type==='expense'&&s.match.test(i.name||""));
      const paid=mine?(+mine.actual||+mine.planned||s.price*r):s.price*r;
      const priced=Math.round(a.p*r*100)/100;
      if(priced>=paid)return;
      const catId=mine?mine.catId:'streaming';
      if(!catById(catId))return;
      const name=mine?mine.name:s.n;
      let it=state.items.find(i=>i.period===next&&i.catId===catId&&
        String(i.name||"").toLowerCase()===name.toLowerCase());
      if(!it){ it={id:uid(),period:next,type:'expense',catId,name,planned:0,actual:0,log:[]}; state.items.push(it); }
      it.planned=priced;
      it.name=name+" ("+a.n+")";
      count++; total+=paid-priced;
    });
  });
  save(); render();
  toast(count?(count+" lines set in "+periodLabel(next)+", saving "+money0(total)+" a month"):"Tick some switches first");
}
function exportJSON(){
  download("underthemark-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(state,null,2),"application/json");
}
function exportCSV(){
  const lines=[["Month","Type","Category","Line","Planned","Actual","Difference"].join(",")];
  state.items.slice().sort((a,b)=>a.period.localeCompare(b.period)).forEach(i=>{
    const c=catById(i.catId);
    lines.push([i.period,i.type,(c?c.name:""),String(i.name||"").replace(/"/g,'""'),
      (+i.planned||0).toFixed(2),(+i.actual||0).toFixed(2),((+i.actual||0)-(+i.planned||0)).toFixed(2)]
      .map(v=>/[",]/.test(v)?'"'+v+'"':v).join(","));
  });
  download("underthemark-lines.csv",lines.join("\n"),"text/csv");
}
function download(name,text,mime){
  const b=new Blob([text],{type:mime}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
